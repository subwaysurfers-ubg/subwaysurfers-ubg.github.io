<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,nosnippet,noimageindex"><title>Subway Surfers Player</title><link rel="icon" href="/favicon-32.png"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111b2b;-webkit-tap-highlight-color:transparent;font:14px/1.8 Arial,sans-serif;color:#dbe7f0}.fontcache{position:fixed;left:-1000px}#og-game-holder{position:fixed;inset:0;overflow:hidden;background-position:center;background-repeat:no-repeat}.player-problem{position:relative;box-sizing:border-box;width:min(560px,calc(100% - 40px));margin:7vh auto;padding:26px;border:1px solid #476175;border-radius:18px;background:#1a3046}.player-problem h1{font-size:23px;line-height:1.25;color:#ffe05c;margin:0 0 13px}.player-problem p{margin:0 0 14px}.player-problem a{color:#81ded5}.player-problem strong{color:white}</style></head><body><div id="og-game-holder"></div><script>
(function(){'use strict';var holder=document.getElementById('og-game-holder');var failed=false;function problem(title,message){if(failed)return;failed=true;holder.textContent='';var box=document.createElement('section');box.className='player-problem';box.setAttribute('role','status');var heading=document.createElement('h1');heading.textContent=title;var p=document.createElement('p');p.textContent=message;var a=document.createElement('a');a.href='/not-loading.html';a.target='_parent';a.textContent='Open the loading guide →';box.appendChild(heading);box.appendChild(p);box.appendChild(a);holder.appendChild(box);if(window.parent!==window)window.parent.postMessage({type:'player-error'},location.origin);}var canvas=document.createElement('canvas'),gl=null;try{gl=canvas.getContext('webgl')||canvas.getContext('experimental-webgl');}catch(e){}if(!gl){problem('The 3D player could not start','This browser is not providing WebGL, which this game needs. Try a browser and device with working graphics support. The guides are still available.');return;}var lose=gl.getExtension('WEBGL_lose_context');if(lose)lose.loseContext();window.addEventListener('error',function(e){if(e.target&&e.target.tagName==='SCRIPT')problem('A game file did not load','Reload the player once, then check your connection or browser restrictions if the problem repeats.');},true);var adapter=document.createElement('script');adapter.src='js/games_lib/ludiAdapter.js';adapter.onload=function(){var boot=document.createElement('script');boot.src='js/boot.js';document.body.appendChild(boot);};document.body.appendChild(adapter);})();
</script></body></html>
